<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donor Profile | BloodBridge</title>

    <link rel="stylesheet" href="css/auth.css">

    <style>
        .profile-card {
            width: 100%;
            max-width: 520px;
        }

        .profile-card h2 {
            margin-bottom: 8px;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #b91c1c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #991b1b;
        }

        #message {
            text-align: center;
            margin-top: 12px;
            font-weight: 600;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #b91c1c;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="auth-brand">
            <div class="brand-icon">🩸</div>

            <h1>BloodBridge</h1>

            <p>Complete your donor profile</p>
        </div>


        <div class="auth-card profile-card">

            <h2>Donor Profile</h2>

            <p class="subtitle">
                Add your details to help patients find you.
            </p>


            <form id="donorProfileForm">

                <div class="profile-grid">

                    <div>
                        <label>Blood Group</label>

                        <select id="bloodGroup" required>
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>


                    <div>
                        <label>Age</label>

                        <input
                            type="number"
                            id="age"
                            min="18"
                            max="65"
                            placeholder="Enter your age"
                            required
                        >
                    </div>


                    <div>
                        <label>Gender</label>

                        <select id="gender">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>


                    <div>
                        <label>City</label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Enter your city"
                            required
                        >
                    </div>


                    <div class="full-width">
                        <label>Address</label>

                        <textarea
                            id="address"
                            placeholder="Enter your address"
                        ></textarea>
                    </div>


                    <div class="full-width">
                        <label>Last Donation Date</label>

                        <input
                            type="date"
                            id="lastDonationDate"
                        >
                    </div>

                </div>


                <button type="submit">
                    Save Donor Profile
                </button>

                <p id="message"></p>

            </form>


            <a href="donor.html" class="back-link">
                ← Back to Dashboard
            </a>

        </div>

    </div>


    <script src="js/donor-profile.js"></script>

</body>

</html>
