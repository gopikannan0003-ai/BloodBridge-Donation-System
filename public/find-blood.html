<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find Blood | BloodBridge</title>

    <link rel="stylesheet" href="css/find-blood.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🩸 BloodBridge
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="donor.html">Dashboard</a>
            <a href="find-blood.html">Find Blood</a>
            <button id="logoutBtn">Logout</button>
        </div>

    </nav>


    <main class="container">

        <section class="hero">

            <p class="small-title">BLOOD SEARCH</p>

            <h1>Find Blood Donors</h1>

            <p>
                Search for available donors based on blood group
                and city.
            </p>

        </section>


        <section class="search-card">

            <h2>🔎 Search Blood</h2>

            <form id="searchForm">

                <div class="form-group">

                    <label>Blood Group</label>

                    <select id="bloodGroup" required>

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>City</label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city"
                    >

                </div>


                <button type="submit">
                    Search Donors
                </button>

            </form>

        </section>


        <section id="resultsSection" class="results-section">

            <h2>Available Donors</h2>

            <div id="results">

                <div class="empty-message">
                    Select a blood group and search for donors.
                </div>

            </div>

        </section>

    </main>


    <script src="js/find-blood.js"></script>

</body>

</html>
