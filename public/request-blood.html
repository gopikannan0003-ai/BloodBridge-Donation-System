<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Blood | BloodBridge</title>

    <link rel="stylesheet" href="css/request-blood.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">🩸 BloodBridge</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="find-blood.html">Find Blood</a>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="container">

        <section class="hero">
            <p class="small-title">EMERGENCY BLOOD REQUEST</p>

            <h1>Request Blood</h1>

            <p>
                Submit a blood request and connect with available
                donors through BloodBridge.
            </p>
        </section>

        <section class="request-card">

            <h2>🩸 Blood Request Form</h2>

            <p class="subtitle">
                Enter the patient and hospital details below.
            </p>

            <form id="requestForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Patient Name</label>

                        <input
                            type="text"
                            id="patientName"
                            placeholder="Enter patient name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Blood Group</label>

                        <select id="bloodGroup" required>

                            <option value="">
                                Select Blood Group
                            </option>

                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>

                        </select>
                    </div>

                    <div class="form-group">
                        <label>Hospital Name</label>

                        <input
                            type="text"
                            id="hospitalName"
                            placeholder="Enter hospital name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>City</label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Enter city"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Units Required</label>

                        <input
                            type="number"
                            id="unitsRequired"
                            min="1"
                            max="20"
                            placeholder="Example: 2"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Urgency</label>

                        <select id="urgency" required>

                            <option value="Normal">
                                Normal
                            </option>

                            <option value="Urgent">
                                Urgent
                            </option>

                            <option value="Emergency">
                                Emergency
                            </option>

                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Required Date</label>

                        <input
                            type="date"
                            id="requiredDate"
                            required
                        >
                    </div>

                </div>

                <button type="submit">
                    Submit Blood Request
                </button>

                <p id="message"></p>

            </form>

        </section>

    </main>

    <script src="js/request-blood.js"></script>

</body>

</html>
