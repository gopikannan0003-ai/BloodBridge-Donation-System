<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donation History | BloodBridge</title>

    <link rel="stylesheet" href="css/donation-history.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🩸 BloodBridge
    </div>

    <div class="nav-links">
        <a href="donor.html">Dashboard</a>
        <a href="donor-profile.html">My Profile</a>

        <button id="logoutBtn">
            Logout
        </button>
    </div>

</nav>


<main class="container">

    <!-- HERO -->

    <section class="hero">

        <p class="small-title">
            DONATION HISTORY
        </p>

        <h1>
            My Blood Donations 🩸
        </h1>

        <p>
            Keep track of your blood donation records.
        </p>

    </section>


    <!-- SUMMARY -->

    <section class="summary">

        <div class="summary-card">

            <span>🩸</span>

            <div>
                <p>Total Donations</p>
                <h2 id="totalDonations">0</h2>
            </div>

        </div>


        <div class="summary-card">

            <span>❤️</span>

            <div>
                <p>Total Units</p>
                <h2 id="totalUnits">0</h2>
            </div>

        </div>

    </section>


    <!-- ADD DONATION -->

    <section
        id="addDonationSection"
        class="history-section"
        style="display: none;"
    >

        <div class="section-header">

            <h2>
                ➕ Add Donation
            </h2>

            <button
                class="refresh-btn"
                type="button"
                onclick="hideAddDonationForm()"
            >
                ✕ Close
            </button>

        </div>


        <form id="donationForm">

            <!-- Blood Group -->

            <div class="form-group">

                <label for="blood_group">
                    Blood Group
                </label>

                <select
                    id="blood_group"
                    name="blood_group"
                    required
                >

                    <option value="">
                        Select Blood Group
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>

                    <option value="B+">B+</option>
                    <option value="B-">B-</option>

                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>

                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>

            </div>


            <!-- Donation Date -->

            <div class="form-group">

                <label for="donation_date">
                    Donation Date
                </label>

                <input
                    type="date"
                    id="donation_date"
                    name="donation_date"
                    required
                >

            </div>


            <!-- Hospital -->

            <div class="form-group">

                <label for="hospital_name">
                    Hospital / Blood Bank
                </label>

                <input
                    type="text"
                    id="hospital_name"
                    name="hospital_name"
                    placeholder="Enter hospital name"
                >

            </div>


            <!-- City -->

            <div class="form-group">

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter city"
                >

            </div>


            <!-- Units -->

            <div class="form-group">

                <label for="units_donated">
                    Units Donated
                </label>

                <input
                    type="number"
                    id="units_donated"
                    name="units_donated"
                    value="1"
                    min="1"
                    max="10"
                    required
                >

            </div>


            <button
                type="submit"
                class="save-btn"
            >
                🩸 Save Donation
            </button>


            <p id="donationMessage"></p>

        </form>

    </section>


    <!-- HISTORY -->

    <section class="history-section">

        <div class="section-header">

            <h2>
                📋 Donation Records
            </h2>


            <div class="header-buttons">

                <button
                    class="refresh-btn"
                    type="button"
                    onclick="showAddDonationForm()"
                >
                    ➕ Add Donation
                </button>


                <button
                    class="refresh-btn"
                    type="button"
                    onclick="loadDonationHistory()"
                >
                    🔄 Refresh
                </button>

            </div>

        </div>


        <div id="historyContainer">

            <div class="loading">
                Loading donation history...
            </div>

        </div>

    </section>


</main>


<script src="js/donation-history.js"></script>

</body>

</html>
